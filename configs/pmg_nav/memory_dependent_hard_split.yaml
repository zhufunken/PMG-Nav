# Minimal DynaNav/Isaac-Sim hard split specification for the next Stage 2 gate.
# This is a task manifest, not a request to download another simulator.
name: pmg_memory_dependent_hard_split_v1
simulator: DynaNav/Isaac Sim
seed: 20260903
pilot_fixture: outputs/stage2/annotation/memory_hard_split_smoke.jsonl
pilot_fixture_mode: contract_only
strict_end_to_end: false
scene_hook_required: true
train_episode_count: 24
validation_episode_count: 12
test_episode_count: 12
history_required: true
split_rules:
  train_relations:
    - near_distance
    - left_of
    - facing
  test_relations:
    - between
    - behind
    - metric_distance
  no_relation_metric_pair_overlap: true
episode_requirements:
  multi_hop_relation: 2
  similar_object_distractors: 2
  anchor_occluded_then_reappears: true
  target_pose_changes_after_first_observation: true
  contradictory_observation: true
  revisit_or_verification_required: true
  history_is_necessary_for_success: true
acceptance:
  m1_oracle_vs_m0_goal_pose_error_improvement_m: 0.5
  m2_predicted_vs_m1_goal_pose_error_regression_m: 0.5
  m3_action_checksum_equal_m0: true
  paired_bootstrap_samples: 2000
  paired_confidence_level: 0.95
